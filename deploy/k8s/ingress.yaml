apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qingflow-help-center
  namespace: default
  labels:
    app: qingflow-help-center
  annotations:
    # 根据实际 ingress controller 调整（nginx / traefik 等）
    kubernetes.io/ingress.class: nginx
    # 强制 HTTPS 跳转
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # 静态站点适当增大 body 限制（一般用不到，保持默认即可）
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - help-center.qingflow.com
      # SSL 证书 Secret，需提前创建：
      # kubectl create secret tls help-center-tls \
      #   --cert=tls.crt --key=tls.key -n default
      secretName: help-center-tls
  rules:
    - host: help-center.qingflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qingflow-help-center
                port:
                  number: 80
