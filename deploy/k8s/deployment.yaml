apiVersion: apps/v1
kind: Deployment
metadata:
  name: qingflow-help-center
  namespace: default
  labels:
    app: qingflow-help-center
spec:
  replicas: 2
  selector:
    matchLabels:
      app: qingflow-help-center
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: qingflow-help-center
    spec:
      containers:
        - name: help-center
          # Jenkins 构建时替换为实际镜像地址和 tag
          image: registry.example.com/qingflow/help-center:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
